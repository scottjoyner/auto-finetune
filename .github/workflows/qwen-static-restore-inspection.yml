name: qwen-static-restore-inspection

on:
  pull_request:
    paths:
      - scripts/qwen_static_restore_inspect.py
      - tests/test_qwen_static_restore_inspect.py
      - .github/workflows/qwen-static-restore-inspection.yml
  push:
    branches: [main]
    paths:
      - scripts/qwen_static_restore_inspect.py
      - tests/test_qwen_static_restore_inspect.py
      - .github/workflows/qwen-static-restore-inspection.yml

permissions:
  contents: read

jobs:
  no-deserialization-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline fixture dependencies
        run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Verify ZIP metadata and custody denial controls
        run: |
          python -m py_compile scripts/qwen_static_restore_inspect.py
          python -m pytest -o addopts= tests/test_qwen_static_restore_inspect.py tests/test_qwen_atomic_custody_copy.py tests/test_qwen_restored_file_integrity.py tests/test_qwen_protected_backup_plan.py tests/test_resume_backup_history.py tests/test_resume_backup_audit.py -q

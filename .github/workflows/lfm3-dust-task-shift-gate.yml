name: LFM3 predictive Dust task-shift abstention research

on:
  push:
    branches:
      - "research/lfm3-dust-task-shift-gate-*"
  pull_request:
    paths:
      - "src/lfm3_dust_task_shift_*.py"
      - "src/lfm3_three_method_shadow_registry.py"
      - "tests/test_lfm3_dust_task_shift_*.py"
      - "tests/test_lfm3_three_method_shadow_registry.py"
      - "research/evidence/lfm3-dust-task-shift-20261030/**"
      - ".github/workflows/lfm3-dust-task-shift-gate.yml"

permissions:
  contents: read

jobs:
  offline-novelty-and-admission-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline CPU validation dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile shift head, new task source and strict transfer reviewers
        run: |
          python -m compileall -q src/lfm3_dust_task_shift_gate.py src/lfm3_dust_task_shift_probe.py src/lfm3_dust_task_shift_review.py src/lfm3_dust_task_shift_admission.py src/lfm3_three_method_shadow_registry.py
      - name: Reconstruct every real LFM3 context forecast and all method evidence
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_dust_task_shift_gate.py tests/test_lfm3_dust_task_shift_review.py tests/test_lfm3_three_method_shadow_registry.py tests/test_lfm3_predictive_dust_shadow_bridge.py
          python -m src.lfm3_three_method_shadow_registry --research-only --method predictive_dust --intent inspect > /tmp/lfm3-task-shift-method.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/lfm3-task-shift-method.json"))
          assert r["status"]=="verified_shadow_only"
          assert len(r["evidence_sha256"])==27
          assert r["neural_head_novel_prompts_flagged"]==17
          assert r["neural_head_novel_prompts_total"]==18
          assert r["neural_head_new_task_candidates_abstained"]==144
          assert r["neural_head_task_shift_shadow_admission"]=="shadow_guard_validated_not_optimizer_qualified"
          assert not r["model_training_permitted"]
          assert not r["optimizer_switch_permitted"]
          assert not r["weight_promotion_permitted"]
          PY
      - name: Enforce no automatic optimizer switching
        env:
          PYTHONPATH: .
        run: |
          if python -m src.lfm3_three_method_shadow_registry --research-only --method predictive_dust --intent train > /tmp/lfm3-rejected.json; then
            echo "Unexpected optimizer training authorization"
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open("/tmp/lfm3-rejected.json"))
          assert r["status"]=="blocked"
          assert not r["model_training_permitted"]
          assert not r["weight_promotion_permitted"]
          PY

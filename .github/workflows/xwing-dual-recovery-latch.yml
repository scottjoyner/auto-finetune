name: xwing-dual-recovery-latch

on:
  pull_request:
    paths:
      - src/training_admission.py
      - tests/test_xwing_dual_recovery_latch.py
      - .github/workflows/xwing-dual-recovery-latch.yml
  push:
    branches: [main]
    paths:
      - src/training_admission.py
      - tests/test_xwing_dual_recovery_latch.py
      - .github/workflows/xwing-dual-recovery-latch.yml

permissions:
  contents: read

jobs:
  fail-closed-dual-stop-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Both recovery holds and repository admission regressions
        run: |
          python -m py_compile src/training_admission.py
          python -m pytest -o addopts= tests/test_xwing_dual_recovery_latch.py tests/test_training_admission.py tests/test_qwen_python_runtime_audit.py -q

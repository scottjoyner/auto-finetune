name: xwing-training-admission

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  admission-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small test dependencies
        run: python -m pip install pytest pyyaml
      - name: Validate fail-closed Python and shell entrypoints
        run: |
          python -m py_compile src/training_admission.py src/cli.py src/train.py
          bash -n launch-next.sh
          bash -n scripts/xwing_finetune_guardian.sh
          python -m py_compile scripts/finetune_guardian.py
          python -m py_compile scripts/prune_checkpoints.py
          python -m py_compile scripts/resume_backup_audit.py
          python -m py_compile scripts/qwen_resume_preflight.py
          python -m py_compile src/resume_admission.py scripts/resume_admission_report.py
          for script in post-reboot-gpu-train.sh post-reboot-check.sh post-queue.sh \
              scripts/sft_cascade_watcher.sh scripts/serve_lfm25.sh \
              scripts/lfm25_showdown.sh scripts/legacy_boot/*.sh; do
            bash -n "$script"
          done
      - name: Run synthetic policy and entrypoint regressions
        run: python -m pytest -o addopts= tests/test_training_admission.py tests/test_fleet_training_placement.py tests/test_r9700_recovery_report.py tests/test_shell_training_hold.py tests/test_finetune_guardian.py tests/test_prune_checkpoint_custody.py tests/test_resume_backup_audit.py tests/test_qwen_resume_preflight.py tests/test_direct_train_admission.py tests/test_resume_admission.py -q

name: LFM3 neural Dust disjoint text-family transfer

on:
  push:
    branches:
      - "research/lfm3-dust-text-task-transfer-*"
  pull_request:
    paths:
      - "src/lfm3_dust_text_family_*.py"
      - "src/lfm3_dust_text_transfer_admission.py"
      - "src/lfm3_dust_trainable_attention.py"
      - "tests/test_lfm3_dust_text_family_transfer*.py"
      - "research/evidence/lfm3-dust-text-transfer-20261029/**"
      - ".github/workflows/lfm3-dust-text-task-transfer.yml"

permissions:
  contents: read

jobs:
  frozen-family-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only deterministic CPU-free verification dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile dataset, frozen pretrained model probe, replay and admission
        run: |
          python -m compileall -q src/lfm3_dust_text_family_curriculum.py src/lfm3_dust_text_family_transfer_probe.py src/lfm3_dust_text_family_transfer_review.py src/lfm3_dust_text_transfer_admission.py
      - name: Verify all three real-model task-transfer ledgers and fail-closed promotion
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_dust_text_family_transfer.py tests/test_lfm3_dust_text_family_transfer_review.py tests/test_lfm3_dust_trainable_attention.py tests/test_lfm3_dust_trainable_neural_review.py

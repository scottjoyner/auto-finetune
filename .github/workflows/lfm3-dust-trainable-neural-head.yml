name: LFM3 trainable neural Dust head offline evidence

on:
  push:
    branches:
      - "research/lfm3-dust-trainable-neural-head-*"
  pull_request:
    paths:
      - "src/lfm3_dust_trainable_attention.py"
      - "src/lfm3_dust_trainable_neural_*.py"
      - "src/lfm3_dust_prequential_audit.py"
      - "src/lfm3_dust_prequential_review.py"
      - "tests/test_lfm3_dust_trainable_*.py"
      - "research/evidence/lfm3-dust-trainable-head-20261029/**"
      - ".github/workflows/lfm3-dust-trainable-neural-head.yml"

permissions:
  contents: read

jobs:
  independent-forward-only-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum offline head-only verification dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile independent 195-weight neural attention head and reviewers
        run: |
          python -m compileall -q src/lfm3_dust_trainable_attention.py src/lfm3_dust_trainable_neural_review.py src/lfm3_dust_trainable_neural_admission.py src/lfm3_dust_prequential_audit.py src/lfm3_dust_prequential_review.py
      - name: Reconstruct all trained head parameters and pre-probe forecasts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_dust_trainable_attention.py tests/test_lfm3_dust_trainable_neural_review.py tests/test_lfm3_dust_prequential_audit.py tests/test_lfm3_dust_prequential_review.py tests/test_lfm3_dust_uncertainty_newseed.py tests/test_lfm3_dust_predictor_admission.py

name: LFM3 Dust multiprompt training-side quality guard research

on:
  push:
    branches:
      - "research/lfm3-dust-multiprompt-gate-*"
  pull_request:
    paths:
      - "src/lfm3_dust_multiprompt_*.py"
      - "src/lfm3_three_method_shadow_registry.py"
      - "tests/test_lfm3_dust_multiprompt_*.py"
      - "tests/test_lfm3_three_method_shadow_registry.py"
      - "research/evidence/lfm3-dust-multiprompt-20261030/**"
      - ".github/workflows/lfm3-dust-multiprompt-guard.yml"

permissions:
  contents: read

jobs:
  three-prompt-actual-quality-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline mathematical reviewer dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile frozen research model probe, causal reviewer and admission
        run: |
          python -m compileall -q src/lfm3_dust_multiprompt_quality.py src/lfm3_dust_multiprompt_review.py src/lfm3_dust_multiprompt_admission.py src/lfm3_three_method_shadow_registry.py
      - name: Validate all three pinned LFM3 receipts and no-autonomy controls
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_dust_multiprompt_quality.py tests/test_lfm3_dust_multiprompt_review.py tests/test_lfm3_three_method_shadow_registry.py tests/test_lfm3_predictive_dust_shadow_bridge.py
          python -m src.lfm3_three_method_shadow_registry --research-only --method all --intent inspect > /tmp/lfm3-three-prompt-review.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/lfm3-three-prompt-review.json"))
          assert r['status']=='verified_shadow_only'
          assert len(r['evidence_sha256'])==27
          assert r['multiprompt_quality_admission']=='hold_not_qualified'
          assert r['multiprompt_harmful_neural_updates']==1
          assert r['multiprompt_beneficial_greedy_updates_vetoed']==1
          assert r['multiprompt_actual_model_loss_forwards']==67
          assert not r['optimizer_switch_permitted']
          assert not r['model_training_permitted']
          assert not r['weight_promotion_permitted']
          PY
      - name: Verify training intent is unconditionally rejected
        env:
          PYTHONPATH: .
        run: |
          if python -m src.lfm3_three_method_shadow_registry --research-only --method predictive_dust --intent train > /tmp/lfm3-multiprompt-denied.json; then
            echo "Unexpected model-training promotion"
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/lfm3-multiprompt-denied.json'))
          assert d['status']=='blocked'
          assert d['model_training_permitted'] is False
          assert d['weight_promotion_permitted'] is False
          PY

name: Dust predictive classifier CPU research

on:
  pull_request:
    paths:
      - 'experiments/dust/predictive_direction_classifier.py'
      - 'experiments/dust/predictive_probe_contract.py'
      - 'tests/test_dust_predictive_direction_classifier.py'
      - 'tests/test_dust_predictive_probe_contract.py'
      - 'docs/dust-predictive-*'
      - '.github/workflows/dust-predictive-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic stdlib classifier and contract tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_dust_predictive*.py' -v
      - name: Run frozen synthetic confirmation and assert research HOLD
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m experiments.dust.predictive_direction_classifier \
            --synthetic-only --output "$RUNNER_TEMP/predictive_result.json"
          python - "$RUNNER_TEMP/predictive_result.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["training_episodes"] == 64
          assert r["validation_episodes"] == 16
          assert r["confirmation_episodes"] == 48
          assert r["confirmation_metrics"]["confirmation_verdict"] == "NO_EVIDENCE_OF_SUPERIORITY"
          assert r["confirmation_metrics"]["production_admission"] == "HOLD_NO_REAL_LABELS_OR_HELDOUT_CE"
          assert r["trainer_admission_authorized"] is False
          assert r["hosted_provider_calls"] == 0
          assert r["optimizer_updates"] == 0
          assert r["pretrained_model_loaded"] is False
          print("Synthetic confirmation negative result preserved; no training authority.")
          PY
      - name: Explicit scope boundary
        run: |
          echo "Research-only synthetic classifier and privacy/schema validation."
          echo "No K2 model, CUDA, hosted inference, checkpoint, or trainer integration."
          echo "Not a replacement for full auto-finetune pytest or Dust heldout CE."

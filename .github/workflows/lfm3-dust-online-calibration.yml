name: LFM3 Dust forward-only online head calibration

on:
  push:
    branches:
      - "research/lfm3-dust-online-calibration-*"
  pull_request:
    paths:
      - "src/lfm3_dust_online_calibration.py"
      - "src/lfm3_dust_calibration_review.py"
      - "src/lfm3_dust_predictive_probe.py"
      - "tests/test_lfm3_dust_online_calibration.py"
      - "tests/test_lfm3_dust_calibration_review.py"
      - "research/evidence/lfm3-dust-online-calibration-20261029/**"
      - ".github/workflows/lfm3-dust-online-calibration.yml"

permissions:
  contents: read

jobs:
  forward-only-calibration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline test dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Offline CPU-free contract, replay, safety and evidence verification
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src/lfm3_dust_online_calibration.py src/lfm3_dust_calibration_review.py src/lfm3_dust_activation_head.py src/lfm3_dust_predictive_probe.py
          python -m pytest -o addopts= -q tests/test_lfm3_dust_online_calibration.py tests/test_lfm3_dust_calibration_review.py tests/test_lfm3_dust_activation_head.py tests/test_lfm3_dust_activation_review.py tests/test_lfm3_dust_predictive_probe.py tests/test_lfm3_dust_forward_review.py

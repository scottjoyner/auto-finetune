name: LFM3 benchmark evidence validation
on:
  push:
    branches: [research/lfm3-fleet-bench-20261030]
    paths:
      - 'benchmark/lfm3-evidence/**'
      - '.github/workflows/lfm3-benchmark-receipts.yml'
  pull_request:
    paths:
      - 'benchmark/lfm3-evidence/**'
      - '.github/workflows/lfm3-benchmark-receipts.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate recorded measurements without GPUs
        run: |
          python3 -m py_compile benchmark/lfm3-evidence/run.py benchmark/lfm3-evidence/fleet_runner.py benchmark/lfm3-evidence/summarize.py benchmark/lfm3-evidence/concurrency.py benchmark/lfm3-evidence/resource_profile.py benchmark/lfm3-evidence/quality_probe.py benchmark/lfm3-evidence/validate.py benchmark/lfm3-evidence/summarize_extended.py benchmark/lfm3-evidence/score_retrieval.py benchmark/lfm3-evidence/compare_backends.py benchmark/lfm3-evidence/environment_fingerprint.py benchmark/lfm3-evidence/summarize_backends.py benchmark/lfm3-evidence/compare_hip_fa.py benchmark/lfm3-evidence/summarize_hip_fa.py benchmark/lfm3-evidence/attest_hip_fa.py
          bash -n benchmark/lfm3-evidence/build_hip_fa_q8.sh
          python3 -m unittest discover -s benchmark/lfm3-evidence -p "test_hip_fa_preflight.py"
          python3 benchmark/lfm3-evidence/validate.py
          python3 benchmark/lfm3-evidence/summarize.py
          python3 benchmark/lfm3-evidence/summarize_extended.py
          python3 benchmark/lfm3-evidence/score_retrieval.py
          python3 benchmark/lfm3-evidence/summarize_backends.py
          python3 benchmark/lfm3-evidence/summarize_hip_fa.py
          git diff --exit-code -- benchmark/lfm3-evidence/fleet-summary.json benchmark/lfm3-evidence/extended-summary.json benchmark/lfm3-evidence/quality-scored.json benchmark/lfm3-evidence/backend-comparison-summary.json benchmark/lfm3-evidence/hip-fa-summary.json

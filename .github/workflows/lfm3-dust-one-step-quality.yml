name: LFM3 Dust one-step real diagnostic quality counterfactual

on:
  push:
    branches:
      - "research/lfm3-dust-sandbox-update-quality-*"
  pull_request:
    paths:
      - "src/lfm3_dust_sandbox_update_*.py"
      - "src/lfm3_three_method_shadow_registry.py"
      - "tests/test_lfm3_dust_sandbox_update_*.py"
      - "tests/test_lfm3_three_method_shadow_registry.py"
      - "research/evidence/lfm3-dust-one-step-quality-20261030/**"
      - ".github/workflows/lfm3-dust-one-step-quality.yml"

permissions:
  contents: read

jobs:
  verify-frozen-one-step-adapter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline CPU-only replay dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile source and strict one-step reviewer
        run: |
          python -m compileall -q src/lfm3_dust_sandbox_update_quality.py src/lfm3_dust_sandbox_update_review.py src/lfm3_dust_sandbox_update_admission.py src/lfm3_three_method_shadow_registry.py
      - name: Verify all signed-model candidate results and negative real-quality admission
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_dust_sandbox_update_quality.py tests/test_lfm3_dust_sandbox_update_review.py tests/test_lfm3_three_method_shadow_registry.py tests/test_lfm3_predictive_dust_shadow_bridge.py
          python -m src.lfm3_three_method_shadow_registry --research-only --method all --intent inspect > /tmp/lfm3-quality-review.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/lfm3-quality-review.json"))
          assert r["status"]=="verified_shadow_only"
          assert len(r["evidence_sha256"])==27
          assert r["neural_head_one_step_quality_admission"]=="hold_not_qualified"
          assert r["neural_head_one_step_diagnostic_loss_deltas"]["18"]>0
          assert r["one_step_persistent_model_adapter_updates"]==0
          assert not r["trials_can_be_executed_by_this_interface"]
          assert not r["model_training_permitted"]
          assert not r["optimizer_switch_permitted"]
          assert not r["weight_promotion_permitted"]
          PY
      - name: Assert autonomous actuation remains rejected
        env:
          PYTHONPATH: .
        run: |
          if python -m src.lfm3_three_method_shadow_registry --research-only --method predictive_dust --intent train > /tmp/lfm3-failclosed.json; then
            echo "ERROR: research registry authorized unqualified head"
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open("/tmp/lfm3-failclosed.json"))
          assert r["status"]=="blocked"
          assert not r["model_training_permitted"]
          assert not r["weight_promotion_permitted"]
          PY

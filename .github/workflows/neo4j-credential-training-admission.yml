name: Neo4j credential and training admission (offline)

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline-test dependencies
        run: python -m pip install pytest pyyaml
      - name: Compile source without importing model runtimes
        run: |
          python -m py_compile src/realtime_pipeline.py src/scheduled_retrain.py src/training_admission.py
          python -m py_compile src/pipeline_health.py src/config_validator.py
          python -m py_compile src/data_freshness.py src/auto_scaler.py
          python -m py_compile tests/test_realtime_neo4j_credentials.py tests/test_scheduler_admission_failclosed.py
          python -m py_compile tests/test_pipeline_health_evidence.py tests/test_config_validator_admission.py
          python -m py_compile tests/test_freshness_fails_closed.py tests/test_auto_scaler_failclosed.py
      - name: Exercise synthetic secret, HOLD and training-policy regression tests
        env:
          AF_SKIP_UNMANAGED_CHECK: "1"
          TRAIN_ALLOW_UNVERIFIED: "1"
        run: |
          python -m pytest -q -o addopts= -p no:cacheprovider \
            tests/test_realtime_neo4j_credentials.py \
            tests/test_scheduler_admission_failclosed.py \
            tests/test_failclosed_env_training.py \
            tests/test_pipeline_health_evidence.py \
            tests/test_config_validator_admission.py \
            tests/test_freshness_fails_closed.py \
            tests/test_auto_scaler_failclosed.py

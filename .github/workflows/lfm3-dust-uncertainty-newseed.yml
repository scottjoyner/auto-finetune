name: LFM3 Dust uncertainty head abstention new-seed audit

on:
  push:
    branches:
      - "research/lfm3-dust-uncertainty-abstention-*"
  pull_request:
    paths:
      - "src/lfm3_dust_uncertainty_*.py"
      - "src/lfm3_dust_prequential_audit.py"
      - "src/lfm3_dust_prequential_review.py"
      - "tests/test_lfm3_dust_uncertainty_*.py"
      - "research/evidence/lfm3-dust-newseed-20261029/**"
      - ".github/workflows/lfm3-dust-uncertainty-newseed.yml"

permissions:
  contents: read

jobs:
  historical-only-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal CPU-only research contract dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Verify all new seed receipts, finite forecasts, causal abstentions and no release authority
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src/lfm3_dust_uncertainty_gate.py src/lfm3_dust_uncertainty_replay.py src/lfm3_dust_uncertainty_report.py src/lfm3_dust_prequential_audit.py src/lfm3_dust_prequential_review.py
          python -m pytest -o addopts= -q tests/test_lfm3_dust_uncertainty_gate.py tests/test_lfm3_dust_uncertainty_newseed.py tests/test_lfm3_dust_prequential_audit.py tests/test_lfm3_dust_prequential_review.py tests/test_lfm3_dust_predictor_admission.py

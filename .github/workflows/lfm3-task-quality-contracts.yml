name: LFM3 text task research contracts

on:
  push:
    branches:
      - "research/lfm3-text-task-probe-*"
  pull_request:
    paths:
      - "src/lfm3_lora_text_task_probe.py"
      - "src/lfm3_lora_text_task_review.py"
      - "tests/test_lfm3_lora_text_task_probe.py"
      - "tests/test_lfm3_lora_text_task_review.py"
      - ".github/workflows/lfm3-task-quality-contracts.yml"

permissions:
  contents: read

jobs:
  task-probe-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only contract dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Validate deterministic splits and offline safety without loading weights
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src/lfm3_lora_text_task_probe.py src/lfm3_lora_text_task_review.py
          python -m pytest -o addopts= -q tests/test_lfm3_lora_text_task_probe.py tests/test_lfm3_lora_text_task_review.py

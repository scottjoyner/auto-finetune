name: core CPU tests (model integrations separate)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared CPU-only test prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install apsw pyyaml pytest pytest-cov
      - name: Run CPU-core tests with unchanged 69% coverage floor
        run: |
          # These four modules import PyTorch/Transformers at collection time.
          # They require a separately provisioned local model-test runner.
          # Do not silently call them passed or install multi-GB GPU deps here.
          python -m pytest tests \
            --ignore=tests/test_bench_matrix.py \
            --ignore=tests/test_compat_lfm2_rocm.py \
            --ignore=tests/test_drivers_localchat.py \
            --ignore=tests/test_quantize.py
      - name: Report excluded model-dependent integration test collection
        if: always()
        run: |
          {
            echo "### CPU-core CI scope"
            echo "The four PyTorch/Transformers model-integration modules below were **NOT run**."
            echo "The model-dependent suite requires the separately gated local runner:"
            echo "- tests/test_bench_matrix.py"
            echo "- tests/test_compat_lfm2_rocm.py"
            echo "- tests/test_drivers_localchat.py"
            echo "- tests/test_quantize.py"
            echo ""
            echo "The core coverage gate remains **69%**; it has not been reduced."
            echo "No model training, CUDA/ROCm downloads, production changes or NAS operations."
          } >> "$GITHUB_STEP_SUMMARY"

name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          # These are imports in the existing full test suite; do not skip
          # dependent tests or relax the coverage threshold.
          python -m pip install apsw pyyaml pytest pytest-cov transformers
          # CPU-only PyTorch: no CUDA/ROCm/GPU drivers on hosted runners.
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests with coverage
        run: pytest

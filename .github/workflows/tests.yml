name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the repository's declared dependencies first, then the
          # extras the test suite imports. Do not skip dependent tests or
          # lower the coverage gate to make a run green.
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov transformers triton==3.4.0
          # CPU-only PyTorch: no CUDA/ROCm/GPU drivers on hosted runners.
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests with coverage
        run: pytest

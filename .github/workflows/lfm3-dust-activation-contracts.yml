name: LFM3 activation-conditioned Dust research

on:
  push:
    branches:
      - "research/lfm3-activation-predictive-head-*"
  pull_request:
    paths:
      - "src/lfm3_dust_activation_head.py"
      - "src/lfm3_dust_activation_review.py"
      - "src/lfm3_dust_predictive_probe.py"
      - "tests/test_lfm3_dust_activation_*.py"
      - "research/evidence/lfm3-dust-activation-20261029/**"
      - ".github/workflows/lfm3-dust-activation-contracts.yml"

permissions:
  contents: read

jobs:
  activation-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline contract dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Validate causal activation attention, signed-offline boundaries and evidence
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src/lfm3_dust_activation_head.py src/lfm3_dust_activation_review.py src/lfm3_dust_predictive_probe.py
          python -m pytest -o addopts= -q tests/test_lfm3_dust_activation_head.py tests/test_lfm3_dust_activation_review.py tests/test_lfm3_dust_predictive_probe.py tests/test_lfm3_dust_forward_review.py

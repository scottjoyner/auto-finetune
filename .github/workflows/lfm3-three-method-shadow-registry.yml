name: LFM3 three-method evidence-backed shadow registry

on:
  push:
    branches:
      - "research/lfm3-three-method-shadow-registry-*"
  pull_request:
    paths:
      - "src/lfm3_three_method_shadow_registry.py"
      - "src/lfm3_predictive_dust_shadow_bridge.py"
      - "tests/test_lfm3_three_method_shadow_registry.py"
      - "tests/test_lfm3_predictive_dust_shadow_bridge.py"
      - "docs/LFM3_THREE_METHOD_PREDICTIVE_DUST_SHADOW_INTERFACE_20261030.md"
      - ".github/workflows/lfm3-three-method-shadow-registry.yml"

permissions:
  contents: read

jobs:
  evidence-backed-shadow-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum offline contract dependencies
        run: python -m pip install pytest==9.0.3 pyyaml==6.0.3
      - name: Compile common strategy and trained neural-head bridge
        run: |
          python -m compileall -q src/lfm3_three_method_shadow_registry.py src/lfm3_predictive_dust_shadow_bridge.py
      - name: Verify twelve real source receipts and reject any method actuation
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -o addopts= -q tests/test_lfm3_three_method_shadow_registry.py tests/test_lfm3_predictive_dust_shadow_bridge.py
          python -m src.lfm3_three_method_shadow_registry --research-only --method all --intent inspect > /tmp/lfm3-three-methods-verified.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/lfm3-three-methods-verified.json'))
          assert p['status']=='verified_shadow_only'
          assert set(p['methods'])=={'adamw','muon','predictive_dust'}
          assert p['neural_head_transfer_admission']=='hold_not_qualified'
          assert not p['optimizer_switch_permitted']
          assert not p['model_training_permitted']
          assert not p['weight_promotion_permitted']
          PY
      - name: Assert automatic self-training intent remains denied
        env:
          PYTHONPATH: .
        run: |
          if python -m src.lfm3_three_method_shadow_registry --research-only --method predictive_dust --intent train > /tmp/lfm3-train-denied.json; then
            echo "ERROR: shadow interface incorrectly allowed training"
            exit 1
          fi
          python - <<'PY'
          import json
          p=json.load(open('/tmp/lfm3-train-denied.json'))
          assert p['status']=='blocked'
          assert not p['model_training_permitted']
          assert not p['optimizer_switch_permitted']
          assert not p['weight_promotion_permitted']
          PY
